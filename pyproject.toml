[project]
name = "mlx-edge"
version = "0.1.0"
description = "CLI-first local LLM inference for Apple Silicon via MLX. OpenAI-compatible API + preflight guardrails."
authors = [{name = "Open Ma"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
server = [
    "mlx-lm>=0.21",
    "mlx-vlm>=0.1.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mlx-edge = "mlx_edge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]